sitemap_urls = []

[peertube]
max_height = 240

[crawl]
max_file_size_mb = 300
seed_days = false
seed_date_templates = [ { template = "https://azbyka.ru/days/{date}", from = "2026-10-05", to = "2026-10-05", priority = 5 },
]

[rules]
add_exclude = ['^https://azbyka\.ru/biblia/', '^https://media\.azbyka\.ru/audio/biblia/', '(?i)(sitemap[^/]*\.xml(\.gz)?$|/biblia/sitemap)']
