[site]
start_urls = [
  "https://azbyka.ru/audio/nikolaj-serbskij-besedy-na-evangeliya.html",
  "https://azbyka.ru/days/2026-10-05",
  
  "https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/tom2-asketicheskie-opyty/",
  "https://azbyka.ru/otechnik/Antonij_Surozhskij/uchites-molitsja/",
