# Пример пользовательских настроек. Скопируйте в config.toml и оставьте
# только нужные строки — остальное берётся из azbyka_reserv/default_config.toml.

[crawl]
# Куки браузера после входа на azbyka.ru (для книг, доступных только вошедшим).
# cookies_file = "cookies.txt"

# Ограничить скорость скачивания, КБ/с (0 — без ограничения).
# bandwidth_limit_kbps = 4000

# Не качать файлы крупнее N МБ (0 — без ограничения).
# max_file_size_mb = 0

# Сколько лет календаря сохранять.
# date_from = "2000-01-01"
# date_to = "2045-12-31"

[peertube]
# Качество видео с tube.azbyka.ru: 360 / 480 / 720 / 1080.
# max_height = 720

[rules]
# Дополнить список исключений (add_ — добавить к стандартному, а не заменить):
# add_exclude = ['(?i)\.(mp4|webm)(\?|$)']        # не качать видеофайлы

# Включить форумы: заменить список исключений целиком на свой, без строки про forum.
