[crawl]
# Потоки: страницы/картинки и тяжёлые файлы (mp3, pdf, epub, видео) идут
# в разных очередях, чтобы долгие закачки не тормозили обход страниц.
page_workers = 3
media_workers = 2

# Минимальный интервал между началами запросов (секунды) на весь обходчик.
# 0.7 => ~1,4 запроса в секунду. Разведка: 1 запрос/с сайт держал без
# единого 429. Не уменьшайте: сайт содержит фонд, а защита DDoS-Guard
# может начать блокировать.
min_delay = 0.7
timeout = 60
max_tries = 6
# 0 = без ограничения глубины (глубина используется только для порядка обхода)
max_depth = 0

# Соблюдать robots.txt. Всё, что отсечено, попадает в отчёт `status`.
respect_robots = true
# robots.txt azbyka.ru закрывает от поисковиков *.mp3, *.epub, *.m4b, *.djvu,
# *.mobi, файлы «для читалок», а media.azbyka.ru и tube.azbyka.ru — целиком.
# Это запрет индексации поисковиками, а не скачивания: сайт сам предлагает
# эти файлы людям. "pages" — правила применяются только к страницам.
robots_scope = "pages"
# Страницы, нужные для архива, несмотря на запрет robots.txt:
# тексты богослужений по датам и API видеосервера (описания роликов).
robots_override = [
  # robots.txt запрещает /biblia/?*&ru (Синодальный «с ударениями»), но без «$» это
  # задевает и переводы Победоносцева (&ru-p) и Десницкого (&ru-d)
  '^https://azbyka\.ru/biblia/\?[^&]+&ru-[a-z]+$',
  '^https://azbyka\.ru/worships/\?date=',
  '^https://azbyka\.ru/bogosluzhebnye-ukazaniya',
  '^https://tube\.azbyka\.ru/api/',
]
# Clean-param из robots.txt ломает /worships/?…&worship=… — не применять.
apply_clean_param = false

# Честный User-Agent. Можете дописать контакт (e-mail) для администраторов.
user_agent = "Mozilla/5.0 (compatible; azbyka-reserv/0.2; offline-archive)"

# 0 = без ограничения размера файла. Например 2048 = пропускать файлы > 2 ГБ.
max_file_size_mb = 0
# HTML/CSS/JSON больше этого размера не разбираются на ссылки (но сохраняются).
max_page_size_mb = 30
# Остановиться, если на диске осталось меньше (ГБ).
min_free_gb = 5
# Ограничение скорости скачивания (КБ/с), 0 = без ограничения.
bandwidth_limit_kbps = 0

# Не больше N разных вариантов query-строки на один путь (защита от ловушек
# вида ?sort=..&page=..&filter=..). Исключения — в [[query_cap]] ниже.
query_variants_cap = 300

# Качать картинки/стили/шрифты со сторонних CDN, нужные для отображения.
external_assets = true
# 'хост' блокирует хост целиком, 'хост/путь' — только этот путь.
asset_host_blocklist = [
  "mc.yandex.ru", "an.yandex.ru", "yandex.ru/ads", "google-analytics.com", "googletagmanager.com",
  "doubleclick.net", "googlesyndication.com", "top-fwz1.mail.ru", "top.mail.ru", "counter.yadro.ru",
  "facebook.com", "facebook.net", "connect.facebook.net", "vk.com", "vk.ru", "mediametrics.ru",
  "liveinternet.ru", "hotjar.com", "pinterest.com", "addthis.com", "pluso.ru", "relap.io",
  "cackle.me", "cdn.jsdelivr.net/npm/yandex-metrica-watch", "connect.ok.ru", "t.me", "telegram.me",
]

# Встраиваемые плееры сторонних площадок: собираются в таблицу embeds
# (скачиваются отдельно командой `video`, нужен yt-dlp). Своё видео
# (tube.azbyka.ru) качается обычным обходом — см. [peertube].
embed_hosts = [
  "youtube.com", "youtube-nocookie.com", "youtu.be", "rutube.ru", "vk.com", "vkvideo.ru",
  "vimeo.com", "ok.ru", "dzen.ru", "smotrim.ru", "soundcloud.com", "podster.fm", "mave.digital",
]

# Куки браузера (формат Netscape cookies.txt) — для книг «Отечника»
# (EPUB/PDF/сканы), которые сайт отдаёт только после входа.
# См. docs/02-zapusk-na-pk.md, раздел 5.
cookies_file = ""
# Без cookies_file эти адреса не запрашиваются (сайт всё равно ответит
# переходом на вход). Как только куки появятся — встанут в очередь сами.
login_required = [
  '^https://azbyka\.ru/otechnik/books/(download|original)/',
]

# Календарь бесконечен: даты вне диапазона не обходятся.
date_from = "2000-01-01"
date_to = "2045-12-31"
date_filter_patterns = [
  '^https://azbyka\.ru/days/',
  '^https://azbyka\.ru/worships/',
  '^https://azbyka\.ru/biblia/days/',
  '^https://azbyka\.ru/bogosluzhebnye-ukazaniya',
  '^https://azbyka\.ru/kliros/for-date',
]
# Страницы календаря на каждый день диапазона (ближайшие к сегодняшнему — первыми).
seed_days = true
seed_days_template = "https://azbyka.ru/days/{date}"
# Шаблоны «на каждый день». Тексты служб есть только по таким адресам
# (ссылок на них в HTML нет — выбор даты и службы делается скриптом).
seed_date_templates = [
  # ближайшие годы — в первую очередь
  { template = "https://azbyka.ru/worships/?date={date}&worship=vespers", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=matins", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=liturgy", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas1", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas3", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas6", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas9", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=requests", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chants", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=compline", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  { template = "https://azbyka.ru/bogosluzhebnye-ukazaniya?date={date}", from = "2025-09-01", to = "2027-12-31", priority = 10 },
  # остальные годы — позже
  { template = "https://azbyka.ru/worships/?date={date}&worship=vespers", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=matins", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=liturgy", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas1", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas3", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas6", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chas9", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=requests", from = "2020-01-01", to = "2035-12-31", priority = 40 },
  { template = "https://azbyka.ru/worships/?date={date}&worship=chants", from = "2020-01-01", to = "2035-12-31", priority = 40 },
