  { template = "https://azbyka.ru/bogosluzhebnye-ukazaniya?date={date}", from = "2020-01-01", to = "2035-12-31", priority = 40 },
]

# Если сеть пропала (главный сайт не отвечает) — пауза в секундах и повтор.
pause_on_network_error = 300
# Неудачный адрес повторяется через 30 с, 60 с, 2 мин… (до часа), остальные идут своим чередом.
retry_backoff = 30

[peertube]
# Собственный видеосервер портала (6 267 роликов, ~3 000 часов). Ролики
# берутся через его API: по одному файлу на ролик, не выше max_height
# (240/360/480/720/1080). 720 ≈ 0,9–1,2 ТБ; 480 ≈ 0,6–0,9 ТБ; 360 ≈ 0,5 ТБ.
hosts = ["tube.azbyka.ru"]
max_height = 720
# Обойти полный список роликов (а не только встроенные в страницы).
seed_listing = true

[rules]
default_priority = 50
# Картинки и стили наследуют приоритет своей страницы; найденные только в
# картах сайта (<image:loc>) — вот с этим приоритетом.
asset_default_priority = 45

# Не обходить (регулярные выражения по полному URL).
exclude = [
  # форумы всех разделов: пользовательский контент и персональные данные
  # (включить можно в своём конфиге)
  '^https://azbyka\.ru/([^/]+/)?(forum|detforum|duhovnikforum)(/|$)',
  # знакомства
  '^https://azbyka\.ru/znakomstva',
  # служебные поддомены: счётчики, всплывающие подсказки
  '^https?://(stat|ajax)\.azbyka\.ru/',
  # вход/регистрация/выход/личный кабинет — особенно важно при работе с куками.
  # Без (?i) и без коротких слов: иначе задело бы, например, /Lk/ (Евангелие от Луки).
  '^https://azbyka\.ru/(auth|lk|account|cabinet|personal)(/|\?|$)',
  '/(login|logout|log-out|signin|sign-in|signup|sign-up|register|registration|lostpassword|password-reset|oauth|my-account|cart|checkout|basket)(/|\?|$)',
  '/(personal|profile|favorites)(/|\?|$)',
  '(?i)wp-login\.php|/wp-admin/|xmlrpc\.php|/wp-json/|/wp-cron\.php|admin-ajax\.php',
  '(?i)[?&](action=logout|logout=|do=logout)',
  # поиск и фильтры-ловушки
  '^https://azbyka\.ru/sear',
  '(?i)/(search|yandex_search|google_search|context-search)(/|\?|$)',
  '(?i)[?&](s|search|searchid|query|text)=',
  '(?i)[?&](orderby|order|sort|sorting|view|display|per_page|limit|filter|lang_switch)=',
  '(?i)[?&](replytocom|share|print|printable|pdf_print|format=amp|content_only|feed)=',
  '^https://azbyka\.ru/obratnaja-svjaz\?',
  # ленты, oEmbed, AMP, комментарии — дубли
  '(?i)/(feed|rss|atom|comments/feed)/?(\?|$)',
  '(?i)/feed/(rss2?|atom|rdf)/?$',
  '(?i)/(embed|amp)/?(\?|$)',
  '(?i)/trackback/?$',
  '/comment-page-\d+',
  '/cdn-cgi/',
  # Отечник: AJAX-дубли глав, аннотации, настройки
  '^https://azbyka\.ru/otechnik/(ajax|ajx|users|favor|settings|book/annotation)(/|\?|-|$)',
  # Библия: многоколоночный режим и «с ударениями» (стихи сворачиваются в главы — см. [[rewrite]])
  '^https://azbyka\.ru/biblia/\?.*~',
  '^https://azbyka\.ru/biblia/\?.*&ru$',
  # меню выбора перевода без главы (/biblia/?a, /biblia/?c …)
  '^https://azbyka\.ru/biblia/\?[A-Za-z_-]+$',
  # календарь: служебное
  '^https://azbyka\.ru/days/(api|search|login|register|site/nameday_widget|x-calendar-month|paskha/pashalnyi_tsikl\.php)',
  '^https://azbyka\.ru/worships/(calendar|__chants)/',
  '^https://azbyka\.ru/worships/\?worship=',   # «сегодня» без даты — дубль
  # тесты: отдельные вопросы и служебные скрипты
  '^https://azbyka\.ru/test/(gettest|getresponse)\.php',
  '^https://azbyka\.ru/test/.*\?(question|rtf|act)',
  # мусор из скриптов: каталоги тем/плагинов
  '/wp-content/(themes|plugins)/[^/]+/?$',
  # m4b — склейки тех же mp3 по 0,5–2 ГБ: дубль (уберите строку, если нужны)
  '(?i)\.m4b(\?|$)',
  # уменьшенные копии картинок WordPress (оригиналы качаются, просмотрщик подставит их)
  '(?i)/wp-content/uploads/.+-\d{2,4}x\d{2,4}\.(jpe?g|png|webp|gif)(\?|$)',
  # MediaWiki (Азбука паломника): история, правки, служебные
  '(?i)^https://azbyka\.ru/palomnik/.*[?&](action|oldid|diff|curid|printable|veaction|redlink|returnto|mobileaction|useskin|uselang)=',
  '(?i)/(Служебная|Special|Участник|User|Обсуждение|Talk|Обсуждение_участника|User_talk):',
  '(?i)/index\.php\?title=(Служебная|Special):',
  # старьё и закрытое (robots.txt)
  '^https://azbyka\.ru/(old|2005|books|biblia0|biblia3|days-new|znakomstvaold|foto_old|frontinskiy_old|scheme_old|islam-koran|mantisbt)(/|$)',
  # счётчики, соцкнопки
  '(?i)/(share|sharer|go|goto|redirect|out)\.php',
]

# Исключения из exclude (то, что надо качать, хотя шаблоны выше совпали).
include_override = [
  '(?i)/(Служебная|Special):(Все_страницы|AllPages|Категории|Categories)',
  # API видеосервера: список роликов листается с ?sort=publishedAt (стабильный порядок)
  '^https://tube\.azbyka\.ru/api/',
]

# Сохранять, но не искать в них ссылки.
no_follow = []

# Переписывание адресов (первое совпадение). Ссылка на стих/диапазон
# Библии = страница главы; адрес без кода перевода = синодальный (&r).
[[rewrite]]
pattern = '^(https://azbyka\.ru/biblia/\?[1-4]?[A-Za-z]+\.\d+)[:,\-][^&~]*(&[A-Za-z_-]+)$'
replace = '\1\2'
[[rewrite]]
pattern = '^(https://azbyka\.ru/biblia/\?[1-4]?[A-Za-z]+\.\d+)(?:[:,\-][^&~]*)?$'
replace = '\1&r'

# Варианты адресов: каждая глава Библии во всех переводах сайта
# (перевод переключается параметром, ссылок на все переводы в HTML нет).
[[variants]]  # церковнославянский, русские, греческий, латинский, еврейский, сирийский, английские
pattern = '^https://azbyka\.ru/biblia/\?([1-4]?[A-Za-z]+\.\d+)&r$'
template = 'https://azbyka.ru/biblia/?{1}&{x}'
values = ["c", "utfcs", "cs", "b", "j", "ru-p", "ru-d", "g", "el", "el-na28", "l", "he", "syc", "a", "en-kjv", "en-nrsv"]
priority = 11
[[variants]]  # остальные языки
pattern = '^https://azbyka\.ru/biblia/\?([1-4]?[A-Za-z]+\.\d+)&r$'
template = 'https://azbyka.ru/biblia/?{1}&{x}'
values = ["ar", "n", "az", "am", "v", "bg", "chn", "hr", "cze", "es", "fi", "h", "y", "u", "de_ml", "m", "de_el", "is", "it-cei74", "it", "jp", "kk", "s", "lv", "mt", "no-b", "pl", "ro", "pt", "sb", "z", "w", "se", "p", "t", "ua", "k", "o"]
priority = 45

# Приоритеты (меньше = раньше). Первое совпадение выигрывает.
# Ресурсы страниц (картинки, стили) наследуют приоритет страницы.
[[priority]]  # robots и карты сайта
pattern = '(?i)(/robots\.txt$|sitemap[^/]*\.xml(\.gz)?$|/biblia/sitemap)'
value = 1
[[priority]]  # книги для читалок
pattern = '(?i)\.(epub|fb2|fb2\.zip)(\?|$)'
value = 8
[[priority]]  # толкования, подстрочник, словарь Стронга — после самих глав
pattern = '^https://azbyka\.ru/biblia/(in|podstrochnik|strong)(/|\?|$)'
value = 15
[[priority]]  # ядро: Библия, молитвослов, богослужение, право
pattern = '^https://azbyka\.ru/(biblia|molitvoslov|worships|bogosluzhenie|bogosluzhebnye-ukazaniya|chaso-slov|psalms|pravo)(/|\?|$)'
value = 10
[[priority]]  # календарь
pattern = '^https://azbyka\.ru/(days|imeniny)(/|\?|$)'
value = 12
[[priority]]  # святоотеческая библиотека (текст)
pattern = '^https://azbyka\.ru/otechnik(/|$)'
value = 14
[[priority]]  # главная, древо, гид
pattern = '^https://azbyka\.ru/(drevo-sajta|sajty-portala|gid|about-all)?$'
value = 14
[[priority]]  # энциклопедия: словарь и статьи в корне домена
pattern = '^https://azbyka\.ru/(dictionary|1)(/|$)'
value = 16
[[priority]]
pattern = '^https://azbyka\.ru/[^/?#]+/?$'
value = 16
[[priority]]  # PDF (сканы книг, ноты, последования)
pattern = '(?i)\.(pdf|djvu|doc|docx)(\?|$)'
value = 20
[[priority]]
pattern = '^https://azbyka\.ru/(vopros|quotes|shemy|fiction|kliros|deti|palomnik|art|parkhomenko|katehizacija|propovedi|apokalipsis|memo|way|life|death|semya|zdorovie|trezvost|sueverie|stenyaev|chinaorthodox|japanorthodox|frontinskiy)(/|\?|$)'
value = 22
[[priority]]  # аудио Библии в прочих переводах — позже основного
pattern = '^https://media\.azbyka\.ru/audio/biblia/(?!(r|c|cs|utfcs)/)'
value = 40
[[priority]]  # аудио Писания, молитв, богослужения
pattern = '(?i)^https://(media\.)?azbyka\.ru/(audio|days)/.*(svyashhennoe-pisanie|svjashhennoe_pisanie|biblia|psaltir|evangel|molitv|zachala|tropari|bogosluzh)'
value = 24
[[priority]]
pattern = '^https://azbyka\.ru/(audio|video|foto|recept|garden|test|viktorina|quiz|crosswords|opros|games)(/|\?|$)'
value = 30
[[priority]]  # аудиофайлы
pattern = '(?i)\.(mp3|m4a|ogg|aac|flac|wav|wma)(\?|$)'
value = 35
[[priority]]  # описания роликов PeerTube (маленькие JSON) — до самих видео
pattern = '^https://tube\.azbyka\.ru/api/'
value = 58
[[priority]]  # видеофайлы — самое объёмное, в конце
pattern = '(?i)\.(mp4|webm|m4v|mkv|avi|mov|flv)(\?|$)'
value = 60
[[priority]]
pattern = '^https://azbyka\.ru/news(/|$)'
value = 70

# Лимиты числа вариантов query-строки для конкретных путей.
[[query_cap]]  # Библия: 1 361 глава × 55 переводов + 34 748 толкований по стихам
pattern = '^https://azbyka\.ru/biblia/'
value = 150000
[[query_cap]]
pattern = '^https://azbyka\.ru/days/'
value = 30000
[[query_cap]]
pattern = '^https://azbyka\.ru/(worships/|bogosluzhebnye-ukazaniya|kliros/for-date)'
value = 200000
[[query_cap]]  # постраничный список роликов PeerTube
pattern = '^https://tube\.azbyka\.ru/api/'
value = 100000
