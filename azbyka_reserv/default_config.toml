# Настройки по умолчанию для обхода azbyka.ru.
# НЕ редактируйте этот файл — создайте свой config.toml (см. config.example.toml)
# и укажите его через --config. Ваш файл накладывается поверх этого.
# Регулярные выражения пишутся в одинарных кавычках '...' (без экранирования).

[site]
# Хосты, которые считаются «своими»: ссылки на них обходятся рекурсивно.
# Поддомены (static.azbyka.ru и т.п.) входят автоматически.
scope_hosts = ["azbyka.ru"]

# Зеркальные домены приводятся к одному, чтобы не качать всё дважды.
# Если по каноническому адресу 404 — пробуется исходный (alias_fallback).
host_aliases = { "www.azbyka.ru" = "azbyka.ru", "azbyka.org" = "azbyka.ru", "www.azbyka.org" = "azbyka.ru" }
alias_fallback = true
https_hosts = ["azbyka.ru"]

# Параметры запроса, которые выбрасываются из URL (мусор/трекинг). '*' — префикс.
drop_params = [
  "utm_*", "fbclid", "gclid", "yclid", "ysclid", "_ga", "_gl", "_openstat", "mc_cid", "mc_eid",
  "replytocom", "share", "amp", "from_widget", "ref", "_", "msclkid", "the_url",
  # метки версий у стилей/скриптов/файлов: ?ver=5.1, ?v=4.4 — один и тот же файл
  "ver", "v",
]

# Сторонние хосты, с которых можно качать медиа (mp3/pdf...), если ссылки
# с azbyka.ru ведут туда напрямую (например внешнее файловое хранилище).
extra_media_hosts = []

# Карты сайта (кроме тех, что объявлены в robots.txt).
sitemap_urls = [
  "https://azbyka.ru/sitemap.xml",
  "https://azbyka.ru/sitemap_index.xml",
]

# Стартовые страницы: корни всех разделов портала + карты разделов.
start_urls = [
  "https://azbyka.ru/",
  "https://azbyka.ru/drevo-sajta",
  "https://azbyka.ru/sajty-portala",
  "https://azbyka.ru/gid",
