# Настройки по умолчанию для обхода azbyka.ru (выверены разведкой живого сайта,
# см. probe/LIVE-FINDINGS.md). НЕ редактируйте этот файл — создайте свой
# config.toml (образец config.example.toml): он накладывается поверх этого.
# Регулярные выражения пишутся в одинарных кавычках '...' (без экранирования).
# Ключ с префиксом add_ (add_exclude, add_start_urls…) дополняет список, а не заменяет.

[site]
# «Свои» хосты: ссылки на них обходятся рекурсивно. Поддомены входят
# автоматически (media.azbyka.ru — аудио, tube.azbyka.ru — видео).
scope_hosts = ["azbyka.ru"]

# Другие написания адреса приводятся к azbyka.ru. azbyka.org закрыт
# Cloudflare-проверкой, поэтому повтор по исходному адресу выключен.
host_aliases = { "www.azbyka.ru" = "azbyka.ru", "azbyka.org" = "azbyka.ru", "www.azbyka.org" = "azbyka.ru" }
alias_fallback = false
https_hosts = ["azbyka.ru"]

# Параметры запроса, которые выбрасываются из URL (мусор/трекинг). '*' — префикс.
drop_params = [
  "utm_*", "fbclid", "gclid", "yclid", "ysclid", "_ga", "_gl", "_openstat", "mc_cid", "mc_eid",
  "replytocom", "share", "amp", "from_widget", "ref", "_", "msclkid", "the_url", "nowprocket",
  "_wpnonce", "content_only", "sid", "PHPSESSID",
  # метки версий у стилей/скриптов/файлов: ?ver=5.1, ?v=4.4 — один и тот же файл
  "ver", "v",
]

# Сторонние хосты, с которых можно качать медиа (mp3/pdf...).
extra_media_hosts = []

# Карты сайта. 51 карту из robots.txt обходчик берёт сам; здесь — запасные.
sitemap_urls = [
  "https://azbyka.ru/sitemap_index.xml",
  "https://azbyka.ru/biblia/sitemap",
